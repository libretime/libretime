# This file contains a list of package dependencies.
[common]
# The php-pear package depends on php-(cli|common|xml), be sure to
# install the dependencies with the right php version.
php-pear = bookworm, noble, trixie, resolute
php-amqplib = bookworm, noble, trixie, resolute

[locale]
gettext = bookworm, noble, trixie, resolute

[php-fpm]
php8.2-fpm = bookworm
php8.3-fpm = noble
php8.4-fpm = trixie
php8.5-fpm = resolute

# Bookworm
[php8.2]
php8.2 = bookworm
php8.2-apcu = bookworm
php8.2-bcmath = bookworm
php8.2-cli = bookworm
php8.2-common = bookworm
php8.2-curl = bookworm
php8.2-dev = bookworm
php8.2-gd = bookworm
php8.2-mbstring = bookworm
php8.2-pgsql = bookworm
php8.2-xml = bookworm
php8.2-yaml = bookworm

# Noble
[php8.3]
php8.3 = noble
php8.3-apcu = noble
php8.3-bcmath = noble
php8.3-cli = noble
php8.3-common = noble
php8.3-curl = noble
php8.3-dev = noble
php8.3-gd = noble
php8.3-mbstring = noble
php8.3-pgsql = noble
php8.3-xml = noble
php8.3-yaml = noble

# Trixie
[php8.4]
php8.4 = trixie
php8.4-apcu = trixie
php8.4-bcmath = trixie
php8.4-cli = trixie
php8.4-common = trixie
php8.4-curl = trixie
php8.4-dev = trixie
php8.4-gd = trixie
php8.4-mbstring = trixie
php8.4-pgsql = trixie
php8.4-xml = trixie
php8.4-yaml = trixie

# Resolute
[php8.5]
php8.5 = resolute
php8.5-apcu = resolute
php8.5-bcmath = resolute
php8.5-cli = resolute
php8.5-common = resolute
php8.5-curl = resolute
php8.5-dev = resolute
php8.5-gd = resolute
php8.5-mbstring = resolute
php8.5-pgsql = resolute
php8.5-xml = resolute
php8.5-yaml = resolute
