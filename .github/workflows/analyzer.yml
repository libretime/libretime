name: Analyzer

on:
  workflow_dispatch:
  push:
    branches: [main, stable-*]
    paths:
      - .github/workflows/_python-*.yml
      - .github/workflows/analyzer.yml
      - analyzer/**
      - shared/**
      - tools/python*

  pull_request:
    branches: [main, stable-*]
    paths:
      - .github/workflows/_python-*.yml
      - .github/workflows/analyzer.yml
      - analyzer/**
      - shared/**
      - tools/python*

  schedule:
    - cron: 0 1 * * 1

jobs:
  lint:
    uses: ./.github/workflows/_python-lint.yml
    with:
      context: analyzer

  test-bookworm:
    uses: ./.github/workflows/_python-test.yml
    with:
      context: analyzer
      release: bookworm
